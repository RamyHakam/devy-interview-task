spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quotes}
    username: ${DB_USER:quotes}
    password: ${DB_PASSWORD:quotes}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  approval:
    threshold: ${APPROVAL_THRESHOLD:10000.00}
